[project]
name = "maalim"
version = "1.0.0"
description = "Maalim — verified home-tutor marketplace for Pakistan"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "slowapi>=0.1.9",
    "email-validator>=2.1",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: Depends()/require_role() in argument defaults is the FastAPI idiom —
# see https://fastapi.tiangolo.com/tutorial/dependencies/
ignore = ["B008"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
