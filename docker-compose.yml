services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maalim
      POSTGRES_PASSWORD: maalim
      POSTGRES_DB: maalim
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maalim"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://maalim:maalim@db:5432/maalim
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-change-me}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
